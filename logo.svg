<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" xmlns:c2pa="http://c2pa.org/manifest">
  <!-- Logo Ryhem : un médaillon violet avec un croissant de lune, la lettre R et une étoile -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b28be0"/>   <!-- mauve clair -->
      <stop offset="1" stop-color="#4b2a7b"/>   <!-- violet profond -->
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="46" fill="url(#g)"/>                       <!-- cercle de fond -->
  <circle cx="50" cy="50" r="40" fill="none" stroke="#f3ecfb" stroke-width="1.5" stroke-dasharray="3 3"/> <!-- fil de couture : clin d'oeil à l'artisanat -->
  <path d="M68 22a26 26 0 1 0 10 34a21 21 0 0 1-10-34z" fill="#f3ecfb" opacity=".25"/> <!-- croissant de lune -->
  <text x="50" y="66" text-anchor="middle" font-family="Georgia, serif" font-size="52" font-weight="bold" font-style="italic" fill="#fff">R</text> <!-- initiale de Ryhem -->
  <path d="M76 26l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5z" fill="#f2c96d"/> <!-- petite étoile dorée -->
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
